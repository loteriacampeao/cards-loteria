<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Captura de Leilão — Prévia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: mesa de trabalho — menu fixo no topo, quadro de 4 colunas (uma por vez no celular), ficha do imóvel em painel lateral; a calculadora mantém a ficha de cálculo em duas colunas */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --sunk:#eceeea; --line:#d7dbd4; --ink:#1c2321; --muted:#5d6762;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#e3ebf6;
  --ok:#17784a; --ok-soft:#dcefe4; --warn:#9a6500; --warn-soft:#f6ead2; --bad:#b3261e; --bad-soft:#f7dedb;
  --gray:#5d6762; --gray-soft:#e4e7e2; --shade:rgba(20,26,24,.38);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121615; --panel:#1a1f1e; --sunk:#151a19; --line:#2c3432; --ink:#e7ebe8; --muted:#97a29d;
  --accent:#7fb0ec; --accent-ink:#0d1a2b; --accent-soft:#1c2b3e;
  --ok:#5fcf93; --ok-soft:#173326; --warn:#e3b45a; --warn-soft:#352a14; --bad:#f08a80; --bad-soft:#3a1d1a;
  --gray:#a3ada8; --gray-soft:#262d2b; --shade:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --panel:#1a1f1e; --sunk:#151a19; --line:#2c3432; --ink:#e7ebe8; --muted:#97a29d;
  --accent:#7fb0ec; --accent-ink:#0d1a2b; --accent-soft:#1c2b3e;
  --ok:#5fcf93; --ok-soft:#173326; --warn:#e3b45a; --warn-soft:#352a14; --bad:#f08a80; --bad-soft:#3a1d1a;
  --gray:#a3ada8; --gray-soft:#262d2b; --shade:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600}
h3{font-size:13.5px;font-weight:600}
a{color:var(--accent)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;font-weight:500}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.5;cursor:not-allowed}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.pri:hover:not(:disabled){filter:brightness(1.08)}
button.danger{color:var(--bad)}
button.sm{padding:5px 9px;font-size:12.5px}
button.link{border:0;background:none;color:var(--accent);padding:2px 4px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{font:inherit;color:var(--ink)}

/* menu */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.nav-in{max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand small{color:var(--muted);font-size:12px}
.menu{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.menu a{display:block;padding:7px 12px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.menu a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.menu a .ct{font-family:var(--f-num);font-size:11.5px;margin-left:4px;opacity:.8}
.who{font-size:12px;color:var(--muted)}
.wrap{max-width:1500px;margin:0 auto;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner{padding:10px 14px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-size:13px;margin-bottom:12px}
.banner.bad{background:var(--bad-soft);color:var(--bad)}

/* barra do quadro */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.toolbar .l{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--panel);min-width:0}
.search input{border:0;background:transparent;color:var(--ink);font:inherit;padding:8px 10px;outline:none;width:220px;max-width:100%}
.cut{font-size:12.5px;color:var(--muted)}
.cut b{font-family:var(--f-num);color:var(--ink)}

/* quadro */
.board{display:grid;grid-template-columns:repeat(5,minmax(280px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:10px;scrollbar-gutter:stable}
.col.tri{background:var(--bg);border-style:dashed}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);min-width:0;display:flex;flex-direction:column}
.col-h{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:2px}
.col-h .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col-h .t h2{font-size:14px}
.col-h .t .n{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.col-h .rule{font-size:11.5px;color:var(--muted)}
.col-b{padding:10px;display:grid;gap:8px}
.col-empty{font-size:12.5px;color:var(--muted);padding:6px 4px 10px}
.mcols.seg{display:none}
@media (max-width:720px){
  .mcols.seg{display:flex;margin-bottom:10px}
  .mcols button{flex:1;padding:7px 4px;font-size:12px}
  .board{grid-template-columns:minmax(0,1fr);overflow-x:visible}
  .board .col:not(.on){display:none}
}

.tilew{position:relative}
.tmenu{position:absolute;top:5px;right:5px;padding:1px 8px 5px;font-size:17px;line-height:1;border-color:transparent;background:transparent;color:var(--muted);letter-spacing:1px}
.tmenu:hover,.tmenu[aria-expanded="true"]{border-color:var(--line);background:var(--sunk);color:var(--ink)}
.pop{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.2);padding:4px;display:grid;min-width:200px}
.pop button{border:0;text-align:left;background:none;padding:8px 10px;border-radius:5px;font-weight:500}
.pop button:hover,.pop button:focus-visible{background:var(--sunk)}
.pop .sep{border-top:1px solid var(--line);margin:4px 0}
.tile{display:grid;gap:6px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:10px 11px;font-weight:400}
.tile:hover{border-color:var(--accent)}
.tile{overflow:hidden}
.tile .ph{margin:-10px -11px 2px;height:112px;background:var(--sunk);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ph svg{width:30px;height:30px;opacity:.45}
.tile .ph .nf{position:absolute;bottom:6px;left:8px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;opacity:.75}
.tilew .tmenu{background:var(--panel);border-color:var(--line);opacity:.92}
.tile .top{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding-right:28px}
.tile .mod{font-size:11px;color:var(--muted);letter-spacing:.02em;margin-right:auto}
.tile .tt{font-family:var(--f-display);font-weight:600;font-size:14px;line-height:1.25}
.tile .sub{font-size:12px;color:var(--muted)}
.tile .big{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:6px}
.tile .big b{font-family:var(--f-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .big .small{font-family:var(--f-num);font-size:12.5px;text-align:right}
.tile .foot{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.prog{display:flex;gap:8px;font-size:11.5px}
.prog span{color:var(--muted)}
.prog span.y{color:var(--ok);font-weight:600}
.selo{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:4px;text-transform:uppercase;white-space:nowrap}
.selo.red{background:var(--bad-soft);color:var(--bad)}
.selo.yel{background:var(--warn-soft);color:var(--warn)}
.selo.gray{background:var(--gray-soft);color:var(--gray)}
.selo.green{background:var(--ok-soft);color:var(--ok)}
.selo.blue{background:var(--accent-soft);color:var(--accent)}
.pos{color:var(--ok)} .neg{color:var(--bad)} .wrn{color:var(--warn)}

/* painel do imóvel */
.shade{position:fixed;inset:0;background:var(--shade);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(820px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@media (max-width:820px){.drawer{padding-left:env(safe-area-inset-left,0px)}}
.dh{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px 0;display:grid;gap:8px}
.dh .row1{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.dh .row1 h1{font-size:18px}
.dh .meta{font-size:12px;color:var(--muted)}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{font-size:11.5px;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.steps span.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.steps span.done{background:var(--accent-soft);color:var(--accent)}
#dh{display:grid;gap:8px}
.dh .df{background:none;border:0;padding:0;display:grid;gap:6px}
.dh .df .acts{justify-content:flex-start}
.dh .df .acts .sp{order:9;margin-left:auto;margin-right:0}
details.why>summary{cursor:pointer;font-size:12.5px;color:var(--warn);list-style:none}
details.why>summary::-webkit-details-marker{display:none}
details.why>summary::before{content:"▸ ";font-size:10px}
details.why[open]>summary::before{content:"▾ "}
details.why ul{margin:4px 0 0;padding:0}
.dtabs{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 12px}
.dtabs button{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:6px 11px;color:var(--ink);font-size:13px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.dtabs button:hover{border-color:var(--accent)}
.dtabs button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
@media (max-width:560px){.dtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.dtabs button{justify-content:center;padding:7px 4px;font-size:12px;white-space:normal;text-align:center;line-height:1.2}}
#dfoot{flex:none}
.fase-leg{font-size:12.5px;color:var(--ink);padding:2px 0 6px}
.dtabs button.fora{color:var(--muted);background:var(--sunk);border-style:dashed}
.dtabs button.fase.pend{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);font-weight:600}
.dtabs button.fase.ok{border-color:var(--ok)}
.dtabs button .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block;flex:none}
.dtabs button[aria-selected="true"]{outline:2px solid var(--accent);outline-offset:1px}
.dtabs button .bd{font-family:var(--f-num);font-size:10.5px;margin-left:4px;padding:1px 5px;border-radius:99px;background:var(--bad-soft);color:var(--bad)}
.dtabs button .bd.ok{background:var(--ok-soft);color:var(--ok)}
.db{flex:1;overflow-y:auto;padding:14px 16px 24px;display:grid;gap:14px;align-content:start}
.df{background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;display:grid;gap:8px}
.df .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.df .acts .sp{margin-right:auto;font-size:12px;color:var(--muted)}
.why{font-size:12.5px;color:var(--muted);display:grid;gap:2px}
.why li{margin-left:16px}
.why.ok{color:var(--ok)}

.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.box>.hd{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.box>.hd small{font-size:12px;color:var(--muted);font-weight:400;font-family:var(--f-body)}
.box>.bd{padding:12px 14px;display:grid;gap:10px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fields.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.fields .full{grid-column:1/-1}
@media (max-width:560px){.fields,.fields.three{grid-template-columns:minmax(0,1fr)}}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.in{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--sunk);min-width:0}
.in:focus-within{border-color:var(--accent)}
.in span{padding:0 8px;color:var(--muted);font-size:12px;font-family:var(--f-num)}
.in input,.in select,.in textarea{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:8px 10px;outline:none}
.in textarea{min-height:64px;resize:vertical}
.in input.n{font-family:var(--f-num);text-align:right}
.hint{font-size:11.5px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;padding:6px 10px;font-size:12.5px;background:var(--panel)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg.ans button[aria-pressed="true"][data-v="sim"]{background:var(--accent-soft);color:var(--accent)}
.alert{padding:9px 12px;border-radius:6px;font-size:12.5px;display:grid;gap:6px}
.alert.red{background:var(--bad-soft);color:var(--bad)}
.alert.yel{background:var(--warn-soft);color:var(--warn)}
.alert.green{background:var(--ok-soft);color:var(--ok)}
.alert.gray{background:var(--sunk);color:var(--muted)}
.alert b{font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--panel);padding:9px 11px;display:grid;gap:2px;min-width:0}
.stat b{font-family:var(--f-num);font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b.big{font-size:21px}
.praca{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,.7fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:560px){.praca{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.praca .pn{grid-column:1/-1}}
.praca .pn{font-size:12px;font-weight:600;color:var(--muted);padding-bottom:9px}

/* comparáveis */
.comp{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:8px;background:var(--panel)}
.comp.off{opacity:.55}
.comp .ch{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.comp .cg{display:grid;grid-template-columns:minmax(0,2.4fr) repeat(3,minmax(0,1fr));gap:8px}
.comp .cg2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.comp .cg,.comp .cg2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.comp .cg .lk{grid-column:1/-1}}

/* fontes e pontos de atenção */
.fonte{border:1px solid var(--line);border-radius:7px;padding:10px 12px;display:grid;gap:5px;background:var(--panel)}
.fonte.off{opacity:.6}
.fonte .fh{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.fonte .fh b{font-family:var(--f-display);font-size:13.5px}
.fonte .fh .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.fonte .fd{font-size:13.5px}
.fonte .fn{font-family:var(--f-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
a.go{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border:1px solid var(--line);border-radius:6px;text-decoration:none;font-size:12.5px;font-weight:500;white-space:nowrap}
a.go:hover{border-color:var(--accent)}
.pontos{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.pontos li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 10px;background:var(--sunk);border-radius:6px;font-size:13.5px}
.pontos li .n{font-family:var(--f-num);font-size:11.5px;color:var(--muted);padding-top:2px}
.pontos .pe{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:560px){.pontos .pe{grid-template-columns:minmax(0,1fr)}}
/* jurídico */
.blk{display:grid;gap:0}
.blk>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.blk>summary::-webkit-details-marker{display:none}
.blk>summary h3{display:flex;gap:8px;align-items:center}
.blk>summary h3::before{content:"▸";color:var(--muted);font-size:11px;transition:transform .15s}
.blk[open]>summary h3::before{transform:rotate(90deg)}
.blk[open]>summary{border-bottom:1px solid var(--line)}
.blk .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.q{padding:11px 14px;border-top:1px solid var(--line);display:grid;gap:7px}
.q:first-of-type{border-top:0}
.q .qt{font-size:13.5px;display:flex;gap:6px;align-items:flex-start}
.q .qt .lk{color:var(--bad);font-size:12px;flex:none;padding-top:1px}
.q.na{opacity:.6}
.q.locked{background:var(--bad-soft)}
.q.locked .qt{color:var(--bad)}
.q .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.q .obs{flex:1;min-width:180px}
.q .att{font-size:12px}
.q .att a{word-break:break-all}

/* listas */
.list{display:grid;gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:10px 12px;display:grid;gap:4px}
.item .r1{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;justify-content:space-between}
.item .tt{font-weight:600;font-family:var(--f-display)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipf{border-radius:99px;padding:5px 11px;font-size:12.5px}
.chipf[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}

(function(){
"use strict";
/* =================== utilidades =================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const safeUrl=u=>/^https?:\/\//i.test(String(u||"").trim())?String(u).trim():"";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const brl=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const n2=new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fR=v=>isFinite(v)?brl.format(v):"—";
const fP=v=>isFinite(v)?(v*100).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%":"—";
const fK=v=>{ if(!isFinite(v)) return "—"; const a=Math.abs(v); return (v<0?"-":"")+"R$ "+(a>=1000?(a/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":n2.format(a)); };
const fR0=v=>isFinite(v)?new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}).format(v):"—";
/* confiança do preço (garimpagem): alta / media / baixa */
const CONF={alta:"green",media:"blue",baixa:"yel"}, CONF_L={alta:"alta",media:"média",baixa:"baixa"};
function confKey(c){ const n=norm(c&&c.notaConfianca); return n.startsWith("alt")?"alta":n.startsWith("med")?"media":n.startsWith("baix")?"baixa":""; }
function parseNum(s){
  if(typeof s==="number") return s;
  s=String(s||"").trim().replace(/[R$\s%]/g,"");
  if(!s) return 0;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  const v=parseFloat(s); return isFinite(v)?v:0;
}
const fMoneyIn=v=>(+v)?n2.format(+v):"";
function fD(iso){ if(!iso) return "—"; const p=String(iso).slice(0,10).split("-"); return p.length===3? p[2]+"/"+p[1]+"/"+p[0] : iso; }
function fDT(iso){ const d=new Date(iso); return isNaN(d)?"—":d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function daysUntil(iso){ const [y,m,d]=String(iso).slice(0,10).split("-").map(Number); const t=new Date(); return Math.round((Date.UTC(y,m-1,d)-Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))/864e5); }
function quando(iso){ const n=daysUntil(iso); return n===0?"hoje":n===1?"amanhã":n>1?"em "+n+" dias":n===-1?"ontem":"há "+(-n)+" dias"; }
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function getPath(o,p){ return p.split(".").reduce((a,k)=>a==null?a:a[k],o); }
const isObj=v=>v!=null&&typeof v==="object"&&!Array.isArray(v);
/* caminho que vai para o banco: o próprio campo, ou a lista inteira quando ele está dentro de uma lista
   (o banco junta objetos, mas troca listas inteiras) */
function patchPath(o,p){ const ks=p.split("."), acc=[]; let a=o; for(const k of ks){ if(Array.isArray(a)) break; acc.push(k); a=a==null?a:a[k]; } return acc.join("."); }
/* histórico e comentários: um mapa por id; cada pessoa só acrescenta a própria entrada */
function logOf(c){ return (c.log||[]).concat(Object.values(c.logx||{}).filter(Boolean)).sort((a,b)=>String(a.em).localeCompare(String(b.em))); }
function cmtsOf(c){ return (c.comentarios||[]).concat(Object.values(c.cmtx||{}).filter(Boolean)).sort((a,b)=>String(a.em).localeCompare(String(b.em))); }
function logPatch(txts,ts,por){ const m={}; for(const t of txts) m[rid()]={em:ts,por:por??null,txt:t}; return m; }
function setPath(o,p,v){ const ks=p.split("."); let a=o; for(let i=0;i<ks.length-1;i++){ if(a[ks[i]]==null||typeof a[ks[i]]!=="object") a[ks[i]]={}; a=a[ks[i]]; } a[ks[ks.length-1]]=v; }

/* =================== padrões (config/padroes) =================== */
const CIDADES_DEF=["Belo Horizonte","Contagem","Betim","Patos de Minas","Bom Despacho","Uberlândia","Uberaba","Pouso Alegre","Nova Lima","Varginha","Ituiutaba"];
const CFG_DEF={giro:12,reforma:3000,corteBruto:60,corteLiquido:30,itbiPadrao:2,itbi:{"Belo Horizonte":3}};
let CFG=clone(CFG_DEF);
function itbiDe(cidade){ const n=norm(cidade); for(const k in (CFG.itbi||{})){ if(norm(k)===n) return +CFG.itbi[k]; } return +CFG.itbiPadrao||2; }
const cB=()=>(+CFG.corteBruto||60)/100, cL=()=>(+CFG.corteLiquido||30)/100;

/* =================== modalidades =================== */
const MOD_EXT=["Caixa – Leilão SFI","Caixa – Licitação aberta","Caixa – Venda online/direta","Banco – Lei 9.514 (1º/2º leilão)"];
const MOD_JUD=["Cível","Trabalhista","Fiscal","Condomínio","Falência/Recuperação","Outro"];
function tipoDaModalidade(m){ const n=norm(m); if(!n) return null; if(n.includes("judicial")&&!n.includes("extra")) return "Judicial"; if(MOD_JUD.some(x=>norm(x)===n)) return "Judicial"; return "Extrajudicial"; }
const isPGFN=c=>/pgfn|comprei/i.test([c.modalidade,c.credor,c.linkAnuncio,c.leiloeiroSite].join(" "))||/pgfn/i.test([c.descricao,c.observacoes].join(" "));
const isLei9514=c=>/9\.?514|1º\/2º|banco/i.test(c.modalidade||"");
const isCaixaDireta=c=>/venda online|venda direta|direta|licita/i.test(c.modalidade||"")&&!isLei9514(c);

/* =================== motor da Calculadora de Arremate (sem alterações) =================== */
const MG=[[1400,220.55],[2720,359.76],[5440,521.35],[7000,721.75],[14000,962.47],[28000,1243.47],[42000,1564.07],[56000,1925.31],[70000,2326.51],[105000,2928.06],[140000,3721.52],[175000,3979.69],[210000,4238.32],[280000,4772.07],[350000,4903.53],[420000,5035.59],[560000,5523.14],[700000,5826.70],[840000,6130.87],[1120000,6866.53],[1400000,7437.64],[1680000,8009.72],[3200000,8582.97]];
/* tabela de cartório: a de Padrões, se houver; senão a TJMG 2026 acima */
function tabCart(){ const t=CFG.cartorio; return Array.isArray(t)&&t.length?t.map(x=>[+x.ate,+x.valor]):MG; }
function cartMG(v){ if(v<=0) return 0; const t=tabCart(); for(const [lim,val] of t){ if(v<=lim) return val; } return t[t.length-1][1]; }
function irPF(g){ if(g<=0) return 0; const f=[[5e6,.15],[10e6,.175],[30e6,.2],[Infinity,.225]]; let t=0,prev=0; for(const [lim,a] of f){ if(g>prev){ t+=(Math.min(g,lim)-prev)*a; } prev=lim; } return t; }
function calc(p,lance,giro){
  const leil=lance*p.leiloeiro/100;
  const itbi=lance*p.itbi/100;
  let esc,reg;
  if(p.cartModo==="manual"){ esc=p.escrManual; reg=p.regManual; }
  else { reg=cartMG(lance); esc=p.escritura? cartMG(lance):0; }
  const mRec=giro; /* condomínio e IPTU contam desde o 1º mês */
  const cond=p.condominio*mRec, iptu=p.iptu*mRec;
  const inicial=lance+leil+itbi+esc+reg+p.debitos+p.reforma+p.desocupacao;
  const custo=inicial+cond+iptu;
  let oport=0;
  if(p.oport>0){
    const r=Math.pow(1+p.oport/100,1/12)-1;
    oport=inicial*(Math.pow(1+r,giro)-1);
    const m=p.condominio+p.iptu;
    if(m>0&&mRec>0) oport+=m*((Math.pow(1+r,mRec)-1)/r)-m*mRec;
  }
  const venda=p.venda, corr=venda*p.corretagem/100;
  const ganho=venda-corr-lance-leil-itbi-esc-reg-p.reforma;
  const ir= p.trib==="pf"? irPF(ganho) : p.trib==="pj"? venda*p.pjAliq/100 : 0;
  const res=venda-corr-custo-ir-oport;
  const roi=custo>0? res/custo : NaN;
  const mes=(isFinite(roi)&&roi>-1)? Math.pow(1+roi,1/giro)-1 : NaN;
  return {venda,corr,lance,leil,itbi,esc,reg,debitos:p.debitos,reforma:p.reforma,desoc:p.desocupacao,cond,iptu,oport,ir,custo,res,roi,mes};
}
function lanceMax(p,giro){
  const alvo=p.minimo/100; if(p.venda<=0) return NaN;
  let lo=0,hi=p.venda; if(calc(p,1,giro).roi<alvo) return NaN;
  for(let i=0;i<60;i++){ const mid=(lo+hi)/2; if(calc(p,mid,giro).roi>=alvo) lo=mid; else hi=mid; }
  return Math.floor(lo/100)*100;
}
function cls(roi,min){ return !isFinite(roi)?"": roi>=min?"ok": roi>=0?"warn":"bad"; }
const DEFAULTS={nome:"",cidade:"",link:"",tipo:"leilao",lance:0,venda:0,leiloeiro:5,corretagem:6,giro:12,minimo:30,itbi:2,cartModo:"auto",escritura:true,escrManual:0,regManual:0,debitos:0,reforma:3000,desocupacao:0,condominio:0,iptu:0,trib:"pf",pjAliq:6.73,oport:0,incremento:5000};
function defaultsCfg(){ return Object.assign({},DEFAULTS,{giro:+CFG.giro||12,reforma:+CFG.reforma||0,minimo:+CFG.corteLiquido||30}); }
function simParams(s){ const p=Object.assign({},DEFAULTS,s); delete p.id; delete p.atualizadoEm; delete p.cardId; return p; }

/* =================== estado =================== */
let db=null, user=null, assets=null, myId=null, canWrite=true;
const cards=new Map(); let sims=[], hist=[]; let loaded={cards:false,sims:false,hist:false};

/* =================== derivados do card =================== */
function pracas(c){ return (c.pracas||[]).filter(p=>p&&p.data).slice().sort((a,b)=>(a.data+(a.hora||"")).localeCompare(b.data+(b.hora||""))); }
/* praça de referência: sempre a última (2ª) praça que ainda vai acontecer; a 1ª só quando o lance dela for menor */
function proxPraca(c){ const t=todayISO(); const fut=pracas(c).filter(p=>p.data>=t); if(!fut.length) return null; const vs=fut.filter(p=>+p.valor>0); if(!vs.length) return fut[fut.length-1]; let best=vs[vs.length-1]; for(const p of vs) if(+p.valor<+best.valor) best=p; return best; }
/* praça futura mais próxima (habilitação e prazos); o card só sai quando a ÚLTIMA praça passa */
function proxData(c){ const t=todayISO(); return pracas(c).find(p=>p.data>=t)||null; }
function pracaLbl(c,p){ const ps=pracas(c); return ps.length>1?(ps.indexOf(p)+1)+"ª praça":"Praça"; }
function ultimaPraca(c){ const ps=pracas(c); return ps[ps.length-1]||null; }
/* lance de referência = menor valor mínimo entre as praças que ainda vão acontecer (o lance que você pode dar) */
function lanceRef(c){
  const r=proxPraca(c); if(r&&+r.valor>0) return +r.valor;
  const u=ultimaPraca(c); if(u&&+u.valor>0) return +u.valor;
  const any=(c.pracas||[]).find(p=>+p.valor>0); return any? +any.valor : 0;
}
function lanceRefLbl(c){ const r=proxPraca(c); if(!r) return "lance"; const ps=pracas(c); return ps.length>1? (ps.indexOf(r)+1)+"ª praça" : "praça única"; }
const DIAS=["dom","seg","ter","qua","qui","sex","sáb"];
function fDia(iso){ const [y,m,d]=String(iso).slice(0,10).split("-").map(Number); const w=new Date(y,m-1,d).getDay(); return d.toString().padStart(2,"0")+"/"+String(m).padStart(2,"0")+" ("+DIAS[w]+")"; }
const NIV=["predio","rua","bairro"], NIVL={predio:"Prédio",rua:"Rua",bairro:"Bairro"};
function nivKey(s){ const n=norm(s); return n.startsWith("pred")||n.startsWith("cond")?"predio":n.startsWith("rua")?"rua":"bairro"; }
function quant(arr,q){ const a=arr.slice().sort((x,y)=>x-y); if(!a.length) return NaN; const pos=(a.length-1)*q, lo=Math.floor(pos), hi=Math.ceil(pos); return a[lo]+(a[hi]-a[lo])*(pos-lo); }
function contaminado(x,c){ const v=+x.valor, l=lanceRef(c), a=+c.avaliacao||0; return (l>0&&Math.abs(v-l)<1)||(a>0&&Math.abs(v-a)<1); }
function mercado(c){
  const all=(c.comparaveis||[]).filter(x=>x&&+x.valor>0&&!x.excluido);
  const cont=all.filter(x=>contaminado(x,c));
  const ok=all.filter(x=>!contaminado(x,c));
  const out={avisos:[],p25:NaN,nivel:null,n:0,total:ok.length,metodo:"",m2:NaN,min:NaN,max:NaN,teto:NaN,margem:NaN,fonte:"comparaveis"};
  if(cont.length) out.avisos.push(cont.length+" comparável(is) com valor igual ao lance ou à avaliação (anúncio reindexado) — fora do cálculo.");
  let g=[];
  for(const nv of NIV){ g=ok.filter(x=>nivKey(x.nivel)===nv); if(g.length){ out.nivel=nv; break; } }
  const area=+c.areaPrivativa||0;
  if(g.length){
    out.n=g.length;
    if(area>0&&g.every(x=>+x.area>0)){
      const m2=g.map(x=>x.valor/x.area);
      out.m2=quant(m2,.25); out.p25=out.m2*area; out.min=Math.min(...m2)*area; out.max=Math.max(...m2)*area; out.metodo="P25 do R$/m² × área privativa";
    } else {
      const vs=g.map(x=>+x.valor);
      out.p25=quant(vs,.25); out.min=Math.min(...vs); out.max=Math.max(...vs); out.metodo="P25 dos valores anunciados"; out.m2=area>0?out.p25/area:NaN;
      if(area>0) out.avisos.push("Algum comparável está sem área. Confira as áreas das fontes.");
    }
    out.teto=Math.max(...g.map(x=>+x.valor));
    { const hs=new Set(g.map(x=>{ try{ return new URL(x.link).hostname.replace(/^www\./,""); }catch(e){ return ""; } }).filter(Boolean)); if(g.length>=2&&hs.size===1) out.avisos.push("Todas as fontes são do mesmo site ("+[...hs][0]+"). Misture sites para confirmar o preço."); }
    out.semLink=g.filter(x=>!String(x.link||"").trim()).length;
    if(out.semLink) out.avisos.push(out.semLink+" comparável(is) sem link. O link é obrigatório para conferir o preço.");
    if(g.length<3) out.avisos.push("Só "+g.length+" comparável(is) no nível "+NIVL[out.nivel]+". O ideal é 3 ou mais.");
  } else if(+c.vendaP25>0){
    out.p25=+c.vendaP25; out.fonte="garimpagem"; out.metodo="P25 informado pela garimpagem (sem comparáveis cadastrados)"; out.m2=area>0?out.p25/area:NaN;
    out.avisos.push("Sem comparáveis cadastrados. Cadastre os links para confirmar o preço de venda.");
  }
  const l=lanceRef(c);
  if(isFinite(out.p25)&&l>0) out.margem=out.p25/l-1;
  if(out.margem>1&&out.n<5) out.avisos.push("Margem acima de 100% com poucos comparáveis: confira se o preço não está inflado.");
  return out;
}

}

function ans(c,b,i){ return ((c.juridico||{})[b]||{})[i]||{}; }
function precoVil(c){
  const a=ans(c,"J2","laudo").vals||{}; const laudo=+a.atualizado||+a.valor||0;
  const f=ans(c,"J2","precoVil"); const lance=lanceRef(c);
  if(!(laudo>0)||!(lance>0)) return {ok:false,laudo,lance};
  const lim=laudo*(f.incapaz?0.8:0.5);
  return {ok:true,laudo,lance,lim,vil:lance<lim&&!f.autorizado,pct:lance/laudo};
}
function itemAplica(c,b,it){ return it.k!=="info"&&(!b.when||b.when(c))&&(!it.when||it.when(c)); }
function multiResp(c,b,it){ const a=ans(c,b.id,it.id); if(Array.isArray(a.resp)) return a.resp; const pre=it.pre&&c[it.pre]; return Array.isArray(pre)?pre:[]; }
function itemRespondido(c,b,it){
  const a=ans(c,b.id,it.id);
  if(it.k==="txt") return !!String(a.resp||"").trim();
  if(it.k==="num") return Object.values(a.vals||{}).some(v=>v!==""&&v!=null&&+v!==0);
  if(it.k==="vil") return precoVil(c).ok;
  if(it.k==="multi") return multiResp(c,b,it).length>0;
  return !!a.resp;
}
function itemTrava(c,b,it){
  const a=ans(c,b.id,it.id);
  if(a.excecao&&a.excecao.txt) return false;
  if(it.k==="vil") return !!precoVil(c).vil;
  return !!it.lock&&a.resp===it.lock;
}
function itemAlerta(c,b,it){
  const a=ans(c,b.id,it.id);
  if(it.alertOpts) return it.alertOpts.includes(a.resp);
  if(it.id==="divida"){ const d=+(a.vals||{}).divida||0; const l=precoVil(c).laudo; return d>0&&l>0&&d<l*0.2; }
  return !!it.alert&&a.resp===it.alert;
}
function jurStatus(c){
  const R=roteiro(c); const out={blocos:[],travas:[],lockPend:[],resp:0,total:0,alertas:0};
  for(const b of R){
    const s={b,resp:0,total:0,travas:0,alertas:0,aplica:!b.when||b.when(c)};
    for(const it of b.items){
      if(!itemAplica(c,b,it)) continue;
      s.total++; if(itemRespondido(c,b,it)) s.resp++;
      if(itemTrava(c,b,it)){ s.travas++; out.travas.push({b:b.id,i:it.id,q:it.q,motivo:it.motivo,resp:ans(c,b.id,it.id).resp}); }
      else if((it.lock||it.k==="vil")&&!itemRespondido(c,b,it)) out.lockPend.push({b:b.id,i:it.id,q:it.q});
      if(itemAlerta(c,b,it)) s.alertas++;
    }
    s.risco=!s.resp?"":(s.travas||s.alertas>=3)?"alto":s.alertas?"médio":"baixo";
    out.resp+=s.resp; out.total+=s.total; out.alertas+=s.alertas; out.blocos.push(s);
  }
  out.risco=!out.resp?"":(out.travas.length||out.alertas>=4)?"alto":out.alertas?"médio":"baixo";
  return out;
}
function travasTxt(c){ return jurStatus(c).travas.map(t=>t.q+" → "+t.motivo); }

  const r=[];
  if(c.coluna===1){
    const m=mercado(c);
    if(!(lanceRef(c)>0)) r.push("Informe a praça e o valor mínimo (aba Dados).");
    if(!(m.n>=1)) r.push("Cadastre os comparáveis com link (aba Mercado).");
    else if(m.semLink) r.push("Coloque o link de todos os comparáveis usados (aba Mercado).");
    const s=simInfo(c);
    if(!s) r.push("Salve o cálculo de custos (aba Custos).");
  }
  if(c.coluna===2){
    const j=jurStatus(c);
    for(const t of j.travas) r.push("Trava: “"+t.q+"”. "+t.motivo);
    for(const t of j.lockPend) r.push("Responda o item com cadeado: “"+t.q+"”.");
    const d=c.decisao||{};
    if(!(d.parecer==="Prosseguir"||d.parecer==="Prosseguir com ressalva")) r.push("Registre o parecer “Prosseguir” ou “Prosseguir com ressalva” (aba Decisão).");

  }

}
function margemBaixa(c){

}
function selos(c){
  const s=[]; const p=proxData(c);
  if(p&&(c.coluna<=3)){ const d=daysUntil(p.data), lb=pracaLbl(c,p); s.push(d<=0?["red",lb+" hoje"+(p.hora?" "+p.hora:"")]:[d<=2?"red":d<=7?"yel":"blue",lb+" "+fDia(p.data)+(p.hora?" "+p.hora:"")]); }
  if(!p&&c.coluna<=3&&!pracas(c).length&&/direta|compra direta/i.test(c.modalidade||"")) s.push(["blue","Venda direta · sem data"]);
  if(c.coluna===3&&!(c.habilitacao||{}).aprovada&&p&&daysUntil(p.data)<=3) s.push(["red","Habilitar"]);

  if(c.coluna>=1&&c.coluna<=3&&margemBaixa(c)!==null) s.push(["red","Margem líq. baixa"]);
  if(c.coluna<=1){ const m=mercado(c); if(isFinite(m.margem)&&m.margem<cB()) s.push(["gray","Abaixo do corte"]); }

}

function lancesHTML(p){

    const ca=O("condAlert"); const pc=p.venda>0?p.condominio/p.venda:0;

}

const RES_L={arrematado:"Arrematado",nao_arrematado:"Não arrematado",suspenso:"Suspenso"};
function tabResultado(c){
  if(c.coluna<3) return `<div class="alert gray">O resultado é registrado quando o imóvel está na coluna Leilão.</div>`;
  const r=c.resultado||{}, reg=c.coluna===4, t=r.tipo||(reg?"":"arrematado");
  const campos=t==="arrematado"?`${fx("resultado.valor","Valor da arrematação",{t:"money",l:"R$"})}${fx("resultado.data","Data",{t:"date"})}`
    :t==="nao_arrematado"?`${fx("resultado.vencedor","Lance vencedor (opcional)",{t:"money",l:"R$"})}${fx("resultado.quem","Quem arrematou (se souber)")}${fx("resultado.data","Data",{t:"date"})}`
    :t==="suspenso"?`${fx("resultado.motivo","Motivo da suspensão",{cls:"full"})}${fx("resultado.data","Data",{t:"date"})}`:"";
  let calib="";
  if(t==="nao_arrematado"&&+r.vencedor>0){ const m=mercado(c); calib=`<div class="hint">Lance vencedor = ${isFinite(m.p25)?fP(+r.vencedor/m.p25)+" do preço de venda":"—"} · ${+c.precoTeto>0?fP(+r.vencedor/+c.precoTeto)+" do nosso teto":""}. Fica no Histórico para calibrar a margem.</div>`; }
  return box(reg?"Resultado registrado":"Registrar resultado",`<div class="seg">${Object.keys(RES_L).map(k=>`<button type="button" data-act="rtipo:${k}" aria-pressed="${t===k}">${RES_L[k]}</button>`).join("")}</div>
    ${t?`<div class="fields">${campos}</div>`:`<div class="hint">Escolha o resultado da praça.</div>`}
    ${t==="arrematado"&&!(c.habilitacao||{}).aprovada?`<div class="alert yel">A habilitação não está marcada como aprovada (aba Leilão).</div>`:""}
    ${calib}
    ${t==="arrematado"?`<div class="hint">Pós-arrematação (registro, desocupação, reforma, venda) fica para a próxima versão.</div>`:""}
    ${!reg&&t?`<div><button type="button" class="pri" data-act="regRes:${t}">Registrar resultado</button> <span class="hint">${t==="nao_arrematado"?"O card sai do quadro e vai para o Histórico.":"O card vai para a coluna Resultado e o quadro volta a aparecer."}</span></div>`:""}
    ${reg&&t==="suspenso"?`<div class="alert gray">Quando sair a nova data, atualize a praça na aba Dados e toque em “Voltar para Leilão”.</div><div><button type="button" class="pri" data-act="voltaLeilao">Voltar para Leilão</button></div>`:""}
    ${D.msg.res?`<div class="hint neg">${esc(D.msg.res)}</div>`:""}`)
   +((c.suspensoes||[]).length?box("Suspensões anteriores",(c.suspensoes||[]).map(s=>`<div class="hint">${fD(s.em)} · ${esc(s.motivo||"")}</div>`).join("")):"");
}
/* arquivos e notas */
const ARQ_T=["Edital","Matrícula","Laudo","Print","Outro"];
function tabNotas(c){
  const arqs=(c.arquivos||[]).map((f,i)=>`<div class="file"><a href="/_blob/${esc(f.id)}" target="_blank" rel="noopener">${esc(f.nome||"arquivo")}</a><div class="in"><select data-f="arquivos.${i}.tipo" data-t="sel" aria-label="Tipo">${ARQ_T.map(t=>`<option${f.tipo===t?" selected":""}>${t}</option>`).join("")}</select></div><span class="hint"><span data-uid="${esc(f.por||"")}">${esc(nameOf(f.por))}</span> · ${fDT(f.em)}</span><button type="button" class="sm danger" data-act="rmArq:${i}">Remover</button></div>`).join("");
  const cm=cmtsOf(c).reverse().map(x=>`<div class="cmt"><div class="by"><span data-uid="${esc(x.por||"")}">${esc(nameOf(x.por))}</span> · ${fDT(x.em)}</div><div class="tx">${esc(x.txt)}</div></div>`).join("");
  const lg=logOf(c).reverse().map(x=>`<div><span class="w">${fDT(x.em)}</span><span><b data-uid="${esc(x.por||"")}">${esc(nameOf(x.por))}</b> · ${esc(x.txt)}</span></div>`).join("");
  return box("Arquivos",`<div class="files">${arqs||`<span class="hint">Edital, matrícula, laudo, prints.</span>`}</div>${assets?`<div><button type="button" class="sm" data-act="up:arq">+ Enviar arquivos</button></div>`:`<span class="hint">Envio de arquivos indisponível para o seu acesso.</span>`}`)
   +box("Comentários",`<div class="in"><textarea id="cmtIn" placeholder="Escreva um comentário"></textarea></div><div><button type="button" class="sm pri" data-act="addCmt">Publicar</button></div><div>${cm||`<span class="hint">Nenhum comentário.</span>`}</div>`)
   +box("Histórico de alterações",`<div class="log">${lg||`<span class="hint">Sem registros.</span>`}</div>`);
}
function nameOf(id){ return id? (names[id]||"…") : "Claude (tarefa agendada)"; }
function collectIds(c){ const s=new Set(); logOf(c).forEach(x=>x.por&&s.add(x.por)); cmtsOf(c).forEach(x=>x.por&&s.add(x.por)); (c.arquivos||[]).forEach(x=>x.por&&s.add(x.por)); for(const b of Object.values(c.juridico||{})) for(const a of Object.values(b||{})) if(a&&a.excecao&&a.excecao.por) s.add(a.excecao.por); return [...s]; }
async function resolveNames(ids){
  ids=ids.filter(Boolean); if(!user||!ids.length) return;
  try{ const ps=await user.profiles(ids); for(const id of ids){ names[id]=(ps[id]&&ps[id].name)||"Alguém"; $$(`[data-uid="${CSS.escape(id)}"]`).forEach(el=>el.textContent=names[id]); } }catch(e){}
}

/* =================== rodapé do painel: travas de avanço e ações =================== */
const MOTIVOS=["margem","jurídico","data passou","perdeu interesse","outro"];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function renderFoot(){
  const c=D.work; let h="";
  if(c.status==="descartado"){
    h=`<div class="acts"><span class="sp">Descartado${c.descartadoEm?" em "+fD(c.descartadoEm):""}</span><button type="button" class="pri" data-act="reabrir">Reabrir</button></div>`;
  } else if(c.status==="encerrado"&&!D.desc){
    const reg=c.coluna===3?(D.tab==="resultado"?`<button type="button" class="pri" data-act="regRes:${esc((c.resultado||{}).tipo||"arrematado")}">Registrar resultado</button>`:`<button type="button" class="pri" data-act="tab:resultado">Registrar resultado →</button>`):"";
    h=`<div class="acts"><span class="sp">Prazo encerrado${c.encerradoEm?" em "+fD(c.encerradoEm):""} · no Histórico</span><button type="button" data-act="reabrir">Reabrir no quadro</button>${reg}</div>`;
  } else if(D.desc){
    h=`<div style="display:grid;gap:8px"><span class="lbl">Motivo do descarte</span><div class="seg">${MOTIVOS.map(m=>`<button type="button" data-act="dmot:${encodeURIComponent(m)}" aria-pressed="${D.descMot===m}">${cap(m)}</button>`).join("")}</div>
      <div class="in"><input type="text" id="descTxt" placeholder="Detalhe (obrigatório em “Outro”)" value="${esc(D.descTxt||"")}"></div>
      ${D.msg.desc?`<div class="hint neg">${esc(D.msg.desc)}</div>`:""}
      <div class="acts"><button type="button" data-act="cancelDesc">Cancelar</button><button type="button" class="pri" data-act="confDesc">Descartar</button></div></div>`;
  } else {
    const g=gate(c), col=c.coluna;
    let why="";
    const mb=(col>=1&&col<=3)?margemBaixa(c):null;
    const aviso=mb!==null?`<div class="alert red">⚠️ <b>Atenção:</b> ROI líquido de <b>${fP(mb)}</b>, abaixo do desejado de ${CFG.corteLiquido}%. ${col===1?"Pode avançar, mas confira os custos e o lance antes.":"O imóvel avançou mesmo com a margem abaixo do desejado."}</div>`:"";
    if(col===1||col===2) why=g.length?`<details class="why"${D.whyOpen?" open":""}><summary>Falta${g.length>1?"m":""} ${g.length} item${g.length>1?"s":""} para avançar</summary><ul class="why">${g.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`:`<div class="why ok">Tudo certo para avançar.</div>`;
    const back=col>=1&&col<4?`<button type="button" data-act="move:${col-1}">← Voltar para ${esc(colDe(col-1).t)}</button>`:"";
    let adv, sp;
    { adv=col===0?`<button type="button" class="pri" data-act="move:1">Estudar a fundo →</button>`
      :col===1?`<button type="button" class="pri" data-act="move:2"${g.length?" disabled":""}>Avançar para Análise jurídica →</button>`
      :col===2?`<button type="button" class="pri" data-act="move:3"${g.length?" disabled":""}>Avançar para Leilão →</button>`
      :col===3?(D.tab==="resultado"?`<button type="button" class="pri" data-act="regRes:${esc((c.resultado||{}).tipo||"arrematado")}">Registrar resultado</button>`:`<button type="button" class="pri" data-act="tab:resultado">Registrar resultado →</button>`)
      :c.status==="suspenso"?`<button type="button" class="pri" data-act="voltaLeilao">Voltar para Leilão</button>`:`<button type="button" data-act="voltaLeilaoCorr">Corrigir: voltar para Leilão</button>`;
      sp="Fase: "+colLbl(colDe(col)); }
    h=`<div class="acts"><span class="sp">${esc(sp)}</span>${back}${col<4?`<button type="button" class="danger" data-act="descartar">Descartar</button>`:""}${adv}</div>${aviso}${why}`;
  }
  $("#dfoot").innerHTML=h;
}
function mover(col){
  const from=D.work.coluna;
  if(from===1&&col===2){ const mb=margemBaixa(D.work); if(mb!==null) D.logs.push("⚠️ Avançou com ROI líquido de "+fP(mb)+", abaixo do desejado de "+CFG.corteLiquido+"%"); }
  edit("coluna",col); edit("status",statusDaColuna(col,D.work),"Moveu de “"+colDe(from).t+"” para “"+colDe(col).t+"”");
  if(col===3&&!(D.work.decisao||{}).data) edit("decisao.data",todayISO());
  flush(); D.tab=col<from?({0:"mercado",1:"custos",2:"decisao",3:"leilao"}[col]||"dados"):{0:"dados",1:"dados",2:"juridico",3:"leilao",4:"resultado"}[col]; D.openInit=false; renderDrawer();
}
function onDrawerClick(e){
  if(!D) return;
  const ws=e.target.closest("details.why>summary"); if(ws){ const det=ws.parentElement; setTimeout(()=>{ if(D) D.whyOpen=det.open; },0); return; }
  const sum=e.target.closest(".blk>summary");
  if(sum){ const det=sum.parentElement; setTimeout(()=>{ if(!D) return; if(det.open) D.open.add(det.dataset.blk); else D.open.delete(det.dataset.blk); },0); return; }
  const el=e.target.closest("[data-act]"); if(!el) return;
  const [act,...rest]=el.dataset.act.split(":"); const arg=rest.join(":");
  const w=D.work;
  switch(act){
    case "close": closeCard(); break;
    case "menu": showMenu(el,D.id,true); break;
    case "tab": D.tab=arg; renderHead(); renderTab(); renderFoot(); $("#dbody").scrollTop=0; break;
    case "tipo": if(w.tipoLeilao!==arg){ edit("tipoLeilao",arg,"Corrigiu o tipo de leilão para "+arg); const mods=arg==="Judicial"?MOD_JUD:MOD_EXT; if(w.modalidade&&!mods.includes(w.modalidade)&&tipoDaModalidade(w.modalidade)!==arg) edit("modalidade",""); D.openInit=false; renderTab(); } break;
    case "addPraca": { const ps=(w.pracas||[]).slice(); ps.push({data:"",hora:"",valor:0}); edit("pracas",ps); renderTab(); break; }
    case "delPraca": { const ps=(w.pracas||[]).slice(); ps.splice(+arg,1); edit("pracas",ps); renderTab(); break; }
    case "addComp": { const cs=(w.comparaveis||[]).slice(); cs.push({link:"",descricao:"",valor:0,area:null,quartos:null,vagas:null,condominio:0,iptu:0,nivel:"Bairro"}); edit("comparaveis",cs); if(!D.editComp) D.editComp=new Set(); D.editComp.add(cs.length-1); renderTab(); break; }
    case "editComp": if(!D.editComp) D.editComp=new Set(); D.editComp.add(+arg); renderTab(); break;
    case "doneComp": D.editComp&&D.editComp.delete(+arg); renderTab(); break;
    case "editPontos": D.editPontos=!D.editPontos; renderTab(); break;
    case "addPonto": { const ps=(w.pontos||[]).slice(); ps.push({texto:"",link:""}); edit("pontos",ps); D.editPontos=true; renderTab(); break; }
    case "delPonto": { const ps=(w.pontos||[]).slice(); ps.splice(+arg,1); edit("pontos",ps); renderTab(); break; }
    case "delComp": { const cs=(w.comparaveis||[]).slice(); cs.splice(+arg,1); edit("comparaveis",cs); D.editComp=new Set(); renderTab(); break; }
    case "cniv": { const [i,nv]=arg.split(":"); edit("comparaveis."+i+".nivel",NIVL[nv]); renderTab(); break; }
    case "liq": edit("liquidez",decodeURIComponent(arg)); renderTab(); break;
    case "ans": { const i=arg.lastIndexOf(":"); answer(arg.slice(0,i),decodeURIComponent(arg.slice(i+1))); break; }
    case "exc": { const [b,i]=arg.split("."); const inp=$("#ex-"+b+"-"+i); const t=inp?inp.value.trim():""; if(!t){ D.msg[arg]="Escreva a justificativa da exceção."; renderTab(); return; } delete D.msg[arg]; const it=roteiro(w).find(x=>x.id===b).items.find(x=>x.id===i); edit("juridico."+arg+".excecao",{txt:t,por:myId,em:new Date().toISOString()},"Registrou exceção em “"+it.q+"”: "+t); renderTab(); break; }
    case "rmexc": { const [b,i]=arg.split("."); const it=roteiro(w).find(x=>x.id===b).items.find(x=>x.id===i); edit("juridico."+arg+".excecao",null,"Removeu a exceção de “"+it.q+"”"); renderTab(); break; }
    case "anexar": pickFiles({kind:"anexo",key:arg},false); break;
    case "rmanexo": edit("juridico."+arg+".anexo",null,"Removeu anexo do jurídico ("+arg+")"); renderTab(); break;
    case "up": pickFiles({kind:arg},true); break;
    case "rmFoto": { const f=(w.fotos||[]).slice(); f.splice(+arg,1); edit("fotos",f); renderTab(); break; }
    case "rmArq": { const f=(w.arquivos||[]).slice(); const [x]=f.splice(+arg,1); edit("arquivos",f,"Removeu o arquivo "+(x&&x.nome||"")); renderTab(); break; }
    case "addCmt": { const t=($("#cmtIn").value||"").trim(); if(!t) return; const id=rid(); edit("cmtx."+id,{id,por:myId,em:new Date().toISOString(),txt:t}); flush(); renderTab(); break; }
    case "parecer": { const v=decodeURIComponent(arg); edit("decisao.parecer",v,"Parecer: "+v); if(!(w.decisao||{}).data) edit("decisao.data",todayISO()); renderTab(); break; }
    case "sugTeto": { const s=simInfo(w); if(s&&isFinite(s.max)){ edit("precoTeto",s.max,"Preço teto: "+fR(s.max)+" (sugestão da calculadora)"); renderTab(); } break; }
    case "descJur": D.desc=true; D.descMot="jurídico"; D.msg.desc=""; renderFoot(); break;
    case "calcOpen": abrirCalcDoCard(D.id); break;
    case "copyCorr": {
      const ta=$("#corrMsg"), st=$("#corrSt"); if(!ta) break; const t=ta.value;
      const sel=()=>{ ta.focus(); ta.select(); if(st) st.textContent="Texto selecionado. Use Copiar do seu aparelho."; };
      try{ const pr=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):null;
        if(pr) pr.then(()=>{ if(st) st.textContent="Mensagem copiada."; }).catch(sel); else sel(); }catch(err){ sel(); }
      break; }
    case "multi": { const i=arg.lastIndexOf(":"); const key=arg.slice(0,i), v=decodeURIComponent(arg.slice(i+1)); const [b,it]=key.split("."); const bb=roteiro(w).find(x=>x.id===b), ii=bb.items.find(x=>x.id===it); const cur=multiResp(w,bb,ii).slice(); const k=cur.indexOf(v); if(k>=0) cur.splice(k,1); else cur.push(v); edit("juridico."+key+".resp",cur,"Jurídico "+b+" · "+ii.q+" = "+(cur.join(", ")||"—")); renderTab(); break; }
    case "debq": { const [k,v]=arg.split(":"); edit("debitos."+k+".quem",v,"Débitos: "+(k==="cond"?"condomínio":"IPTU")+" com "+((DEB_Q.find(z=>z[0]===v)||[0,"não informado"])[1]).toLowerCase()); edit("debitosValor",debitosArrem(w)); renderTab(); break; }
    case "rtipo": { edit("resultado.tipo",arg); if(w.coluna===4) edit("status",arg,"Resultado alterado para "+RES_L[arg]); delete D.msg.res; renderTab(); break; }
    case "regRes": if(arg&&!(w.resultado||{}).tipo) edit("resultado.tipo",arg); registrarResultado(); break;
    case "voltaLeilao": case "voltaLeilaoCorr": {
      if(act==="voltaLeilao"&&!proxPraca(w)){ D.msg.res="Atualize a data da praça na aba Dados antes de voltar para Leilão."; D.tab="resultado"; renderDrawer(); return; }
      const r=w.resultado||{}; if(r.tipo==="suspenso") edit("suspensoes",(w.suspensoes||[]).concat({motivo:r.motivo||"",em:r.data||todayISO()}));
      edit("resultado",{}); mover(3); break; }
    case "move": mover(+arg); break;
    case "descartar": D.desc=true; D.descMot=""; D.descTxt=""; D.msg.desc=""; renderFoot(); break;
    case "dmot": D.descMot=decodeURIComponent(arg); renderFoot(); break;
    case "cancelDesc": D.desc=false; renderFoot(); break;
    case "confDesc": {
      if(!D.descMot){ D.msg.desc="Escolha o motivo."; renderFoot(); return; }
      const tx=(D.descTxt||"").trim(); if(D.descMot==="outro"&&!tx){ D.msg.desc="Escreva o motivo em “Outro”."; renderFoot(); return; }
      edit("status","descartado"); edit("motivoDescarte",D.descMot); edit("motivoTexto",tx||null); edit("descartadoEm",new Date().toISOString()); edit("descartadoPor",myId,"Descartou: "+D.descMot+(tx?" — "+tx:""));
      D.desc=false; flush(); renderDrawer(); break; }
    case "reabrir": reabrir(); break;
  }
}
$("#drawerRoot").addEventListener("click",onDrawerClick);
function reabrir(){ const w=D.work; edit("status",statusDaColuna(w.coluna,w)); edit("motivoDescarte",null); edit("motivoTexto",null); edit("descarteAuto",null); edit("reabertoEm",new Date().toISOString(),"Reabriu o imóvel em “"+colDe(w.coluna).t+"”"); flush(); renderDrawer(); }
function registrarResultado(){
  const w=D.work, r=w.resultado||{};
  let err="";
  if(r.tipo==="arrematado"){ if(!(+r.valor>0)) err="Informe o valor da arrematação."; else if(!(w.habilitacao||{}).aprovada) err="Marque a habilitação como aprovada na aba Leilão (etapa obrigatória)."; }
  if(r.tipo==="suspenso"&&!String(r.motivo||"").trim()) err="Informe o motivo da suspensão.";
  if(err){ D.msg.res=err; renderTab(); return; }
  delete D.msg.res;
  if(!r.data) edit("resultado.data",todayISO());
  edit("resultado.registradoEm",new Date().toISOString()); edit("resultado.registradoPor",myId);
  const txt=r.tipo==="arrematado"?"Arrematado por "+fR(+r.valor):r.tipo==="nao_arrematado"?"Não arrematado"+(+r.vencedor>0?" · lance vencedor "+fR(+r.vencedor):" (foi para o Histórico)"):"Suspenso: "+r.motivo;
  edit("coluna",4); edit("status",r.tipo,"Resultado: "+txt);
  flush(); closeCard(); go("oportunidades");
}
/* Custos → Calculadora → volta ao card */
function abrirCalcDoCard(id){
  const c=(D&&D.id===id)?D.work:cards.get(id); if(!c) return;
  flush(); closeCard(); go("calculadora"); cvInit(); cvCards();
  CV.retorno=id;
  const s=simOf(c);
  if(s){ cvOpen(s); $("#cvCard").value=id; cvMark(); } else { CV.curId=null; CV.calc.set(calcDoCard(c)); $("#cvCard").value=id; CV.saved=""; cvMark(); cvList(); }
  cvBanner(); window.scrollTo(0,0);
}
function cvBanner(){
  const el=$("#cvRet"); if(!el) return; const id=$("#cvCard").value; const c=id&&cards.get(id);
  $("#cvPull").hidden=!c;
  if(CV.retorno&&cards.get(CV.retorno)){ el.hidden=false; $("#cvRetTxt").textContent="Calculando para: "+titulo(cards.get(CV.retorno)); $("#cvSave").textContent="Salvar e voltar ao card"; }
  else { el.hidden=true; $("#cvSave").textContent="Salvar"; }
}
/* arquivos (capability assets) */
function pickFiles(target,multi){
  if(!assets){ setSave("Envio de arquivos indisponível para o seu acesso."); return; }
  D.fileTarget=target; const fi=$("#fileIn"); fi.multiple=!!multi; fi.accept=target.kind==="foto"?"image/*":""; fi.value=""; fi.click();
}
async function onFiles(e){
  const files=[...e.target.files]; if(!files.length||!D) return; const d=D, t=d.fileTarget; setSave("Enviando "+files.length+" arquivo(s)…");
  const ok=[];
  for(const f of files){ try{ const r=await assets.upload(f); ok.push({id:r.id,nome:f.name,em:new Date().toISOString(),por:myId}); }catch(err){ setSave("Falha ao enviar "+f.name+(err&&err.message?": "+err.message:"")); } }
  if(D!==d||!ok.length) return;
  if(t.kind==="foto") edit("fotos",(d.work.fotos||[]).concat(ok),"Enviou "+ok.length+" foto(s)");
  else if(t.kind==="arq") edit("arquivos",(d.work.arquivos||[]).concat(ok.map(x=>Object.assign(x,{tipo:/edital/i.test(x.nome)?"Edital":/matr/i.test(x.nome)?"Matrícula":/laudo/i.test(x.nome)?"Laudo":"Outro"}))),"Enviou "+ok.map(x=>x.nome).join(", "));
  else if(t.kind==="anexo") edit("juridico."+t.key+".anexo",ok[0],"Anexou "+ok[0].nome+" ao jurídico ("+t.key+")");
  flush(); renderTab();
}

let CV=null;
function cvInit(){
  if(CV) return; const root=$("#v-calculadora");

function cvList(){

async function cvSave(){
  if(!db) return; const p=CV.calc.get(); const cardId=$("#cvCard").value||null;
  const body=Object.assign({},p,{cardId,atualizadoEm:new Date().toISOString()});

  $("#cvState").textContent="Salvando…";
  try{
    if(CV.curId) await db.collection("simulacoes").doc(CV.curId).set(body); else { const ref=await db.collection("simulacoes").add(body); CV.curId=ref.id; }
    const id=CV.curId, i=sims.findIndex(s=>s.id===id), o=Object.assign({id},body); if(i>=0) sims[i]=o; else sims.unshift(o);
    const ts=new Date().toISOString(), r=calc(p,p.lance,p.giro), mx=lanceMax(p,p.giro);
    if(cardId){ const logx=logPatch(["Vinculou/atualizou o cálculo na Calculadora: ROI "+fP(r.roi)+", lance máximo "+fR(mx)],ts,myId);
      await db.collection("cards").doc(cardId).update({simulacaoId:id,roiLiquido:isFinite(r.roi)?+r.roi.toFixed(4):null,lanceMaximo:isFinite(mx)?mx:null,atualizadoEm:ts,atualizadoPor:myId,logx}); }
    if(prev&&prev.cardId&&prev.cardId!==cardId){ const oc=cards.get(prev.cardId); if(oc&&oc.simulacaoId===id) await db.collection("cards").doc(prev.cardId).update({simulacaoId:null,roiLiquido:null,lanceMaximo:null,atualizadoEm:ts,atualizadoPor:myId}); }
    if(cardId){ const c=cards.get(cardId); if(c) Object.assign(c,{simulacaoId:id,roiLiquido:isFinite(r.roi)?+r.roi.toFixed(4):null,lanceMaximo:isFinite(mx)?mx:null}); }
    CV.saved=cvSnap(); cvMark(); cvList(); try{ localStorage.setItem("ultimaSim",id); }catch(e){}
    if(CV.retorno){ const back=CV.retorno; CV.retorno=null; cvBanner(); go("oportunidades"); openCard(back,"custos"); }
  }catch(e){ $("#cvState").textContent=e&&e.code==="quota_exceeded"?"Limite de armazenamento atingido. Exclua simulações antigas.":"Não foi possível salvar. Tente de novo."; }

/* =================== menu ⋯ do card: abrir, estudar, descartar, excluir =================== */
let menuBtn=null;
function closeMenu(){ const p=$(".pop"); if(p) p.remove(); if(menuBtn){ menuBtn.setAttribute("aria-expanded","false"); menuBtn=null; } }
function showMenu(btn,id,inDrawer){
  const was=menuBtn===btn; closeMenu(); if(was) return;
  const c=(D&&D.id===id)?D.work:cards.get(id); if(!c) return;
  const it=[];
  if(!inDrawer) it.push(["abrir","Abrir e editar"]);
  if(c.status!=="descartado"&&c.coluna===0) it.push(["estudar","Estudar a fundo →"]);
  if(c.status!=="descartado"&&c.coluna<4) it.push(["descartar","Descartar…"]);
  if(c.status==="descartado"||c.status==="encerrado") it.push(["reabrir","Reabrir"]);
  it.push(["sep"]); it.push(["excluir","Excluir…",true]);
  const pop=document.createElement("div"); pop.className="pop"; pop.setAttribute("role","menu");
  pop.innerHTML=it.map(([k,t,d])=>k==="sep"?'<div class="sep"></div>':`<button type="button" role="menuitem" data-mi="${k}"${d?' class="danger"':""}>${esc(t)}</button>`).join("");
  document.body.append(pop); menuBtn=btn; btn.setAttribute("aria-expanded","true");
  const r=btn.getBoundingClientRect(), w=pop.offsetWidth, h=pop.offsetHeight;
  let left=Math.min(r.right-w,innerWidth-w-8); left=Math.max(8,left);
  let top=r.bottom+4; if(top+h>innerHeight-8) top=Math.max(8,r.top-h-4);
  pop.style.left=left+"px"; pop.style.top=top+"px";
  const first=pop.querySelector("button"); if(first) first.focus();
  pop.addEventListener("click",e=>{ const b=e.target.closest("[data-mi]"); if(!b) return; const k=b.dataset.mi; closeMenu(); menuAcao(k,id); });
}
document.addEventListener("click",e=>{ if($(".pop")&&!e.target.closest(".pop")&&!e.target.closest("[data-menu],[data-act='menu']")) closeMenu(); },true);
window.addEventListener("resize",closeMenu);
document.addEventListener("scroll",closeMenu,true);
function menuAcao(k,id){
  if(k==="abrir"){ openCard(id); return; }
  if(k==="excluir"){ confirmExcluir(id); return; }
  if(!D||D.id!==id) openCard(id);
  if(!D) return;
  if(k==="estudar") mover(1);
  if(k==="descartar"){ D.desc=true; D.descMot=""; D.descTxt=""; D.msg.desc=""; renderFoot(); }
  if(k==="reabrir") reabrir();
}
function confirmExcluir(id){
  const c=(D&&D.id===id)?D.work:cards.get(id); if(!c) return;
  const temSim=!!(c.simulacaoId||sims.some(s=>s.cardId===id));
  $("#dlgRoot").innerHTML=`<div class="dlg" data-x="1"><section class="box" role="alertdialog" aria-modal="true" aria-label="Excluir imóvel"><div class="hd"><h2>Excluir “${esc(titulo(c))}”?</h2></div><div class="bd">
    <div>O card some do quadro e apaga junto os dados, comentários, arquivos anexados ao card e o histórico de alterações${temSim?", além do cálculo de custos vinculado":""}. <b>Não dá para desfazer.</b></div>
    <div class="hint">Para só tirar do quadro e manter o registro, use “Descartar”.</div>
    ${db?"":`<div class="alert yel">Abra a página pelo link do Claude para excluir.</div>`}
    <div class="bar" style="justify-content:flex-end"><span class="save-state" id="exSt"></span><button type="button" id="exNo">Cancelar</button><button type="button" class="pri" id="exYes" style="background:var(--bad);border-color:var(--bad)"${db?"":" disabled"}>Excluir de vez</button></div>
  </div></section></div>`;
  const close=()=>{ $("#dlgRoot").innerHTML=""; };
  $("#exNo").addEventListener("click",close); $("#exNo").focus();
  $(".dlg").addEventListener("click",e=>{ if(e.target.dataset.x) close(); });
  $("#exYes").addEventListener("click",async()=>{
    $("#exSt").textContent="Excluindo…";
    try{
      if(D&&D.id===id){ clearTimeout(D.timer); D.dirty.clear(); D.logs=[]; D=null; $("#drawerRoot").innerHTML=""; }
      await db.collection("cards").doc(id).delete();
      const sIds=new Set(sims.filter(s=>s.cardId===id).map(s=>s.id)); if(c.simulacaoId) sIds.add(c.simulacaoId);
      for(const sid of sIds){ try{ await db.collection("simulacoes").doc(sid).delete(); }catch(e){} }
      sims=sims.filter(s=>!sIds.has(s.id)); if(CV&&sIds.has(CV.curId)){ CV.curId=null; CV.saved=""; }
      cards.delete(id); close(); renderAll();
    }catch(e){ $("#exSt").textContent=e&&e.code==="invalid_argument"?"Sem permissão para excluir.":"Não foi possível excluir. Tente de novo."; }
  });
}


/* =================== base de m² por bairro =================== */
/* Doc em "m2": {cidade,bairro,tipo,m2,n,min,max,fontes:[{link,valor,area}],pesquisadoEm:"AAAA-MM-DD",historico:[{data,m2}],origem,obs}
   Validade: 90 dias. Margem na faixa de dúvida (50% a 70%): reconferir se tiver mais de 30 dias.
   Variação acima de 10% numa revisão: o bairro passa a valer 30 dias (campo validadeDias). */
const M2_VALIDADE=90, M2_DUVIDA=30, M2_AVISO=15;
let m2rows=[], fM2="", qM2=""; loaded.m2=false;
function m2Tipo(t){ const n=norm(t); if(!n) return ""; if(n.startsWith("apart")) return "Apartamento"; if(n.startsWith("casa")||n.startsWith("sobrado")) return "Casa"; if(n.startsWith("terr")||n.startsWith("lote")) return "Terreno"; if(/sala|loja|comerc|galp/.test(n)) return "Comercial"; return "Outro"; }
function m2Slug(cidade,bairro,tipo){ const sl=x=>norm(x).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); return sl(cidade)+"__"+sl(bairro)+"__"+sl(tipo); }
function m2Dias(r){ if(!r.pesquisadoEm) return Infinity; const [y,m,d]=String(r.pesquisadoEm).slice(0,10).split("-").map(Number); const a=new Date(y,m-1,d), t=new Date(); t.setHours(0,0,0,0); return Math.round((t-a)/864e5); }
function m2Val(r){ return (r.validadeDias===0||r.validadeDias==="0")?-1:(+r.validadeDias||M2_VALIDADE); }
function m2Status(r){ const d=m2Dias(r), v=m2Val(r); if(!isFinite(d)||d>v) return "vencido"; if(d>v-M2_AVISO) return "vence"; return "valido"; }
const M2_L={valido:"Válido",vence:"Vence em breve",vencido:"Vencido"}, M2_C={valido:"green",vence:"yel",vencido:"red"};
function m2Var(r){ const h=(r.historico||[]).filter(x=>+x.m2>0); if(h.length<2) return NaN; const a=+h[h.length-2].m2, b=+h[h.length-1].m2; return b/a-1; }
function m2Do(c){ const t=m2Tipo(c.tipoImovel); if(!c.cidade||!c.bairro||!t) return null; return m2rows.find(r=>r.id===m2Slug(c.cidade,c.bairro,t))||null; }
function m2RefCard(c){
  const r=m2Do(c); if(!r) return "";
  const st=m2Status(r), d=m2Dias(r), area=+c.areaPrivativa||0, l=lanceRef(c);
  const v=area>0&&+r.m2>0?r.m2*area:NaN, mg=isFinite(v)&&l>0?v/l-1:NaN;
  return `<div class="m2ref"><b>Base de m² do bairro:</b> ${fR(+r.m2)}/m² (${esc(r.tipo)}, ${+r.n||0} fonte(s), pesquisado em ${fD(r.pesquisadoEm)}) <span class="selo ${M2_C[st]}">${M2_L[st]}${isFinite(d)?" · "+d+" dia(s)":""}</span>${isFinite(v)?` · Pela base: venda ${fK(v)}, margem ${fP(mg)}`:""}<div class="hint">A base serve para a triagem. A decisão usa as fontes deste card.</div></div>`;
}
function renderM2(){
  const root=$("#v-m2"); if(!root) return;
  const all=m2rows.slice().sort((a,b)=>(a.cidade||"").localeCompare(b.cidade||"")||(a.bairro||"").localeCompare(b.bairro||"")||(a.tipo||"").localeCompare(b.tipo||""));
  const cnt=k=>all.filter(r=>m2Status(r)===k).length;
  const q=norm(qM2);
  const list=all.filter(r=>(!fM2||m2Status(r)===fM2)&&(!q||norm([r.cidade,r.bairro,r.tipo].join(" ")).includes(q)));
  const cidades=new Set(all.map(r=>r.cidade)).size;
  root.innerHTML=`<div class="toolbar"><div class="l"><h2 style="font-size:18px">Base de m² por bairro</h2><span class="muted">${all.length} bairro(s) · ${cidades} cidade(s)</span>${canWrite&&db?`<button type="button" class="pri sm" data-m2novo="1">+ Novo bairro</button>`:""}</div>
    <label class="search"><input id="qM2" type="search" placeholder="Buscar cidade, bairro, tipo…" aria-label="Buscar na base" value="${esc(qM2)}"></label></div>
   <div class="m2st"><span>Validade: <b>${M2_VALIDADE} dias</b></span><span>Margem entre 50% e 70%: reconfere se tiver mais de <b>${M2_DUVIDA} dias</b></span><span>Mudou mais de 10% numa revisão: o bairro passa a valer <b>30 dias</b></span><span>Imóvel em estudo: sempre fontes novas do prédio ou da rua</span></div>
   <div class="chips" style="margin-bottom:12px"><button type="button" class="chipf" data-mf="" aria-pressed="${!fM2}">Todos (${all.length})</button>${Object.keys(M2_L).map(k=>`<button type="button" class="chipf" data-mf="${k}" aria-pressed="${fM2===k}">${M2_L[k]} (${cnt(k)})</button>`).join("")}</div>
   <div class="card tw"><table><thead><tr><th class="tx">Cidade</th><th class="tx">Bairro</th><th class="tx">Tipo</th><th>R$/m² (P25)</th><th>Fontes</th><th>Pesquisado em</th><th class="tx">Situação</th><th>Última revisão</th></tr></thead><tbody>
   ${list.map(r=>{ const st=m2Status(r), d=m2Dias(r), vr=m2Var(r);
     return `<tr class="click" data-m2="${esc(r.id)}"><td class="tx">${esc(r.cidade)}</td><td class="tx wrapc">${esc(r.bairro)}</td><td class="tx">${esc(r.tipo)}</td><td>${fR(+r.m2)}</td><td>${+r.n||0}</td><td>${fD(r.pesquisadoEm)}<div class="hint">${isFinite(d)?d+" dia(s)":""}</div></td><td class="tx"><span class="selo ${M2_C[st]}">${M2_L[st]}</span>${m2Val(r)<0?`<div class="hint">marcado para reconferir</div>`:m2Val(r)!==M2_VALIDADE?`<div class="hint">vale ${m2Val(r)} dias</div>`:""}</td><td>${isFinite(vr)?`<span class="${Math.abs(vr)>.1?"wrn":""}">${vr>0?"+":""}${fP(vr)}</span>`:"—"}</td></tr>
`; }).join("")||`<tr><td colspan="8" class="tx" style="position:static">${db?(loaded.m2?"Nenhum bairro com esse filtro.":"Carregando…"):"Abra esta página pelo link do Claude para ver a base."}</td></tr>`}
   </tbody></table></div>
   <p class="hint">A garimpagem consulta esta base antes de pesquisar preço: se o bairro está válido, usa o valor guardado; se venceu ou não existe, pesquisa e atualiza. Toque num bairro para ver e editar.</p>`;
  const qi=$("#qM2"); if(qi){ qi.addEventListener("input",()=>{ qM2=qi.value; const pos=qi.selectionStart; renderM2(); const n=$("#qM2"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }); }
  $("#ctM2").textContent=all.length||"";
}
$("#v-m2").addEventListener("click",e=>{
  const f=e.target.closest("[data-mf]"); if(f){ fM2=f.dataset.mf; renderM2(); return; }

const M2_TIPOS=["Apartamento","Casa","Terreno","Comercial","Outro"];
function m2P25(fs){ const v=fs.filter(x=>+x.valor>0&&+x.area>0).map(x=>x.valor/x.area); if(!v.length) return {m2:NaN,n:0,min:NaN,max:NaN}; return {m2:quant(v,.25),n:v.length,min:Math.min(...v),max:Math.max(...v)}; }

  if(v==="historico") renderHistorico();
  if(v==="m2") renderM2();
  if(v==="calculadora"&&CV){ cvCards(); cvList(); cvMark(); }
}
function renderAll(){ renderBoard(); if(view()!=="oportunidades") renderView(); if(D) refreshDerived(); }
window.addEventListener("hashchange",()=>{ VIEW=null; route(); });
$$(".menu a").forEach(a=>a.addEventListener("click",e=>{ e.preventDefault(); go(a.dataset.view); }));

/* =================== descarte automático (margem/PGFN) e envio ao Histórico quando a última praça passa (colunas 0 a 3) =================== */
const autoFeito=new Set();
let autoT=null;
function agendarAuto(){ clearTimeout(autoT); autoT=setTimeout(autoDescartar,1500); }
const tabId=rid();
async function autoDescartar(){
  if(!db||!canWrite) return;
  /* só um aparelho aberto faz o descarte de cada vez */
  try{ const l=await db.doc("locks/autodescarte").acquire({holder:tabId,ttlMs:60000}); if(!l.acquired) return; }catch(e){}
  const t=todayISO(), ts=new Date().toISOString();
  const descarta=(c,motivo,tx,logTxt)=>db.collection("cards").doc(c.id).update({status:"descartado",motivoDescarte:motivo,motivoTexto:tx,descartadoEm:ts,descartadoPor:myId,descarteAuto:true,atualizadoEm:ts,atualizadoPor:myId,logx:logPatch([logTxt],ts,myId)}).catch(()=>{});
  const encerra=(c,logTxt,quando)=>db.collection("cards").doc(c.id).update({status:"encerrado",encerradoEm:quando||ts,motivoDescarte:null,motivoTexto:null,descarteAuto:null,atualizadoEm:ts,atualizadoPor:myId,logx:logPatch([logTxt],ts,myId)}).catch(()=>{});
  for(const c of cards.values()){
    if(autoFeito.has(c.id)) continue;
    if(D&&D.id===c.id) continue;
    /* descartados antes só porque a data passou: vão para o Histórico */
    if(c.status==="descartado"){
      if(c.descarteAuto&&c.motivoDescarte==="data passou"){ autoFeito.add(c.id); await encerra(c,"Movido para o Histórico: prazo encerrado (estava em Descartados)",c.descartadoEm); }
      continue; }
    if(["encerrado","nao_arrematado","arrematado","suspenso"].includes(c.status)) continue;
    /* Comprei PGFN (venda da União): fora da análise em qualquer etapa */
    if(c.coluna<=3&&isPGFN(c)){
      autoFeito.add(c.id);
      const tx="Imóvel do Comprei PGFN: fora da análise";
      await descarta(c,"outro",tx,"Descartado automaticamente: "+tx);
      continue; }
    if(!(c.coluna>=0&&c.coluna<=3)) continue;
    /* triados: só fica quem passa no corte de margem bruta pela conta da página */
    if(c.coluna===0&&!c.reabertoEm){ const m=mercado(c);
      if(m.n>=1&&isFinite(m.margem)&&m.margem<cB()){
        autoFeito.add(c.id);
        const g=+c.margemBruta, tx="Margem bruta "+fP(m.margem)+" no recálculo da página, abaixo do corte de "+CFG.corteBruto+"%"+(isFinite(g)&&g>0?"; a garimpagem tinha indicado "+fP(g):"");
        await descarta(c,"margem",tx,"Descartado automaticamente da triagem: "+tx);
        continue; } }
    const u=ultimaPraca(c); if(!u||u.data>=t) continue;
    if(c.reabertoEm&&String(c.reabertoEm).slice(0,10)>=u.data) continue;
    autoFeito.add(c.id);
    await encerra(c,"Foi para o Histórico automaticamente: a última praça ("+fD(u.data)+") já passou");
  }
}

(async()=>{
  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  [db,user,assets]=await Promise.all([use("db"),use("user"),use("assets")]);
  if(!db){ showBanner("Os dados ficam disponíveis quando a página é aberta pelo link do Claude, com a sua conta do Team."); renderAll(); return; }
  if(user){ try{ const me=await user.me(); myId=me.id; $("#whoLbl").textContent=me.name?"· "+me.name:""; const cw=await user.can("data.write"); if(cw===false){ canWrite=false; showBanner("Você pode ver, mas não editar esta página. Peça acesso de Colaborador ao dono."); } }catch(e){} }
  db.doc("config/padroes").onSnapshot(s=>{ CFG=Object.assign(clone(CFG_DEF),s.exists?s.data():{}); renderAll(); },()=>{});
  db.collection("cards").onSnapshot(snap=>{
    for(const ch of snap.docChanges()){
      if(ch.type==="removed") cards.delete(ch.doc.id);
      else { const c=Object.assign({id:ch.doc.id},ch.doc.data()); c.coluna=(c.coluna===0||c.coluna==="0")?0:(+c.coluna||1); cards.set(c.id,c); if(D&&D.id===c.id) syncDrawerFromRemote(c); }
    }
    loaded.cards=true; renderAll(); agendarAuto();
  },e=>showBanner("Não foi possível carregar os imóveis. Recarregue a página.",true));
  let firstSims=true;
  db.collection("simulacoes").orderBy("atualizadoEm","desc").onSnapshot(snap=>{
    sims=snap.docs.map(d=>Object.assign({id:d.id},d.data())); loaded.sims=true;
    if(CV){ if(firstSims){ let last=null; try{ last=localStorage.getItem("ultimaSim"); }catch(e){} const s=sims.find(x=>x.id===last)||sims[0]; if(s&&!CV.curId&&!CV.saved&&!CV.retorno) cvOpen(s); } if(CV.curId&&!sims.some(s=>s.id===CV.curId)) CV.curId=null; }
    firstSims=false; renderAll();
  },()=>{});
  db.collection("historico").onSnapshot(snap=>{ hist=snap.docs.map(d=>Object.assign({id:d.id},d.data())); loaded.hist=true; renderAll(); },()=>{});
  db.collection("m2").onSnapshot(snap=>{ m2rows=snap.docs.map(d=>Object.assign({id:d.id},d.data())); loaded.m2=true; $("#ctM2").textContent=m2rows.length||""; if(view()==="m2") renderM2(); if(D) refreshDerived(); },()=>{ loaded.m2=true; });
})();
})();
